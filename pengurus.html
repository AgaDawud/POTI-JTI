<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengurus | POTI JTI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;600;700&family=Nunito+Sans:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="pengurus">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

  <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.6"/><path d="M2.5 21v-.8a6 6 0 0 1 6-6h1a6 6 0 0 1 6 6v.8"/><path d="M15 4.6a3.6 3.6 0 0 1 0 6.8"/><path d="M18.4 14.6a6 6 0 0 1 3.1 5.6v.8"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 2.5h17A1.5 1.5 0 0 1 22 4v3a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 2 7V4a1.5 1.5 0 0 1 1.5-1.5z"/><path fill-rule="evenodd" d="M3.5 10h17v8.5a3 3 0 0 1-3 3h-11a3 3 0 0 1-3-3zM9.5 12.6a1 1 0 0 0 0 2h5a1 1 0 0 0 0-2z"/></symbol>

<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Menu utama">
    <a class="brand" href="dashboard.html" aria-label="POTI JTI, ke Dashboard">
      <span class="brand__logo" aria-hidden="true">P</span>
      <span class="brand__name">POTI JTI</span>
    </a>

    <p class="nav-label">MAIN MENU</p>
    <nav class="nav">
      <a class="nav__link" href="dashboard.html">
        <svg class="ic nav__icon" aria-hidden="true"><use href="#i-dash"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="nav__link is-active" aria-current="page" href="pengurus.html">
        <svg class="ic nav__icon" aria-hidden="true"><use href="#i-users"/></svg>
        <span>Pengurus</span>
      </a>
      <a class="nav__link" href="produk-jajanan.html">
        <svg class="ic nav__icon" aria-hidden="true"><use href="#i-box"/></svg>
        <span>Produk Jajanan</span>
      </a>
      <a class="nav__link" href="mitra-inventaris.html">
        <svg class="ic nav__icon" aria-hidden="true"><use href="#i-clip"/></svg>
        <span>Mitra Inventaris</span>
      </a>
    </nav>

    <div class="user">
      <span class="user__avatar" aria-hidden="true">PJ</span>
      <div class="user__info">
        <span class="user__name">Admin POTI</span>
        <span class="user__role">Administrator</span>
      </div>
      <!-- ganti href ke halaman login / endpoint logout kamu -->
      <a class="user__logout" href="login.html" aria-label="Keluar">
        <svg class="ic" aria-hidden="true"><use href="#i-logout"/></svg>
      </a>
    </div>
  </aside>
  <div class="scrim" data-scrim></div>

  <main class="main">
    <button class="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Buka menu">
      <svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg>
    </button>

    <header class="page-head reveal" style="--i:0">
      <h1>Pengurus</h1>
      <p>Kelola data pengurus POTI</p>
    </header>

    <div class="toolbar reveal" style="--i:1">
      <button class="btn btn--primary btn--wide" type="button" id="btnAdd">Tambah Data</button>
      <input class="search" id="search" type="search" placeholder="Cari" aria-label="Cari data pengurus" autocomplete="off">
    </div>

    <div class="table-card reveal" style="--i:2">
      <table class="table table--pengurus">
        <colgroup><col><col><col><col><col></colgroup>
        <thead>
          <tr>
          <th scope="col">No</th>
          <th scope="col">Nama Pengurus</th>
          <th scope="col">Jabatan</th>
          <th scope="col">Username</th>
          <th scope="col">Action</th>
          </tr>
        </thead>
        <!-- baris diisi oleh js/admin.js -->
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/admin.js"></script>
<script>
  // Petunjuk kalau js/admin.js tidak termuat (biasanya karena folder js/ tidak ada di samping file HTML ini)
  window.addEventListener('load', function () {
    if (!window.__potiAdminLoaded) console.error('js/admin.js tidak termuat. Pastikan struktur folder: css/admin.css dan js/admin.js berada di samping file HTML.');
  });
</script>
</body>
</html>
